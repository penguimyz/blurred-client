# Shared build coordinates. Anything version-specific lives in
# versions/<version>/gradle.properties instead — see settings.gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Stonecutter prefers the Kotlin DSL and warns loudly otherwise. The Groovy DSL
# works fine here and matches the rest of this build, so acknowledge the warning
# rather than convert three scripts for it.
dev.kikugie.stonecutter.hard_mode=true

# Loader is version-independent enough to share; yarn and fabric-api are not.
loader_version=0.19.3

mod_version=1.0.0
maven_group=dev.blurredclient
archives_base_name=blurred
