# Build coordinates for the 26.x companion mod. See settings.gradle for why
# this is a separate project from `mod/`.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

minecraft_version=26.2
# No yarn line: 26.x is unobfuscated, so this builds against Mojang's own
# names via `loom.officialMojangMappings()`.
loader_version=0.19.3
fabric_version=0.156.0+26.2

mod_version=1.0.0
maven_group=dev.blurredclient
archives_base_name=blurred
