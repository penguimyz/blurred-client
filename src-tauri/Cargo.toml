[package]
name = "blurred-client"
version = "0.2.0"
description = "A Minecraft launcher with Lunar-grade polish and Prism-grade control."
# Becomes the Maintainer field of the .deb/.rpm, so it ships to users.
authors = ["penguimyz <penguimyz@users.noreply.github.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "blurred_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
thiserror = "1"
anyhow = "1"
sha1 = "0.10"
md-5 = "0.10"
futures-util = "0.3"
zip = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
window-vibrancy = "0.5"
keyring = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
