name: Build

# Produces the release artifacts for both platforms:
#   Linux   .deb, .rpm, .AppImage
#   Windows .msi, -setup.exe
#
# Linux runs on ubuntu-22.04 rather than ubuntu-latest on purpose. The bundled
# binaries link against the builder's glibc, so building on the oldest image
# that still ships webkit2gtk-4.1 (which Tauri v2 requires) is what keeps the
# output runnable on non-bleeding-edge distros. Build on 24.04 and the result
# refuses to start on Ubuntu 22.04 / Debian 12 with a GLIBC_2.38 error.
#
# Windows needs no system dependencies: the runners already have the WebView2
# runtime and the MSVC toolchain Tauri links against.

# Builds every branch, not just main: neither bundle can be built or tested on
# the other platform's dev machine, so CI is the only place breakage shows up
# and it should show up before the merge, not after.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      # Don't cancel Linux because Windows broke, or vice versa — on a tag
      # build, one platform's artifacts are still worth having.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux
          - os: windows-latest
            label: windows

    runs-on: ${{ matrix.os }}

    # Needed by the release step on tag builds. Repos created under GitHub's
    # current defaults give GITHUB_TOKEN read-only contents access, which fails
    # the release upload with a 403 only at the very end of a ~15 minute build.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux system dependencies. libdbus-1-dev is not in Tauri's
      # published list but is required here: tao pulls in the `dbus` crate,
      # which links libdbus at build time.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            wget

      # The companion Fabric mod is bundled into the app as Tauri resources
      # (src-tauri/resources/mod/). Rebuilt here rather than trusting the
      # committed copies, so a release can never ship jars that lag the source
      # they were built from.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Stonecutter builds every Minecraft version in the tree from one source
      # pass, so this produces the full set of per-version jars.
      #
      # `shell: bash` so one script covers both runners — the Windows default
      # is PowerShell, which would choke on the loop below.
      - name: Build companion mod (all Minecraft versions)
        shell: bash
        run: |
          cd mod
          chmod +x gradlew
          ./gradlew build --no-daemon
          mkdir -p ../src-tauri/resources/mod
          for dir in versions/*/; do
            v=$(basename "$dir")
            jar=$(find "$dir/build/libs" -name '*.jar' ! -name '*sources*' | head -1)
            cp "$jar" "../src-tauri/resources/mod/blurred-$v.jar"
          done
          ls -la ../src-tauri/resources/mod/

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Without this the two runners share a cache key and thrash each
          # other's entries.
          key: ${{ matrix.label }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build
        run: npm run tauri build

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            find src-tauri/target/release/bundle \
              \( -name '*.msi' -o -name '*-setup.exe' \) -exec cp {} out/ \;
          else
            find src-tauri/target/release/bundle \
              \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} out/ \;
          fi
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: blurred-client-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

      # Tag builds also become a GitHub release, which is what the in-app
      # update check (commands/update.rs) reads to decide a newer build exists.
      # Both matrix legs upload into the same release; the action merges rather
      # than replacing, so whichever finishes second doesn't clobber the first.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
